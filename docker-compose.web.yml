services:
  bang-story-web:
    build:
      context: .
      dockerfile: Dockerfile.web
    image: bang-story-web:local
    container_name: bang-story-web
    restart: unless-stopped
    network_mode: "host"
    volumes:
      - ./data:/app/data
    environment:
      - PORT=3009
      - DATA_DIR=/app/data
